# Productie-overlay bovenop docker-compose.yml (dat bestand blijft ongewijzigd
# — dat is de lokaal geteste configuratie, zonder enige afhankelijkheid van
# code072-infra). Deze overlay:
#   - voegt Traefik-routing toe voor doelenboom.code072.nl (via het gedeelde
#     externe netwerk code072-net, aangemaakt door code072-infra)
#   - sluit de host-poorten die lokaal handig zijn (5432/4000/5173) af naar
#     alleen-127.0.0.1 (db/api, voor incidenteel debuggen via een SSH-tunnel)
#     of helemaal dicht (web) — vanaf internet is straks alleen Traefik
#     (infra-stack) het ingangspunt.
#   - bouwt web met de productie-Dockerfile (Dockerfile.prod: vite build +
#     nginx, i.p.v. de dev-server) en VITE_API_URL='' (same-origin: de app
#     doet relatieve fetch('/api/...'), nginx stuurt dat intern door — geen
#     CORS, geen hardcoded domeinnaam in de build).
#
# Bewust ANDERS dan WWspeur op één punt: daar staat code072-net al in de
# lokaal-geteste docker-compose.yml zelf (lokaal draaien vereist dus ook daar
# de infra-stack). Hier laten we de basis docker-compose.yml bewust vrij van
# die afhankelijkheid — code072-net wordt pas hier, in de productie-overlay,
# toegevoegd (bovenop het bestaande project-netwerk, niet in plaats daarvan)
# zodat db/api/web elkaar nog steeds gewoon vinden zoals lokaal, én web+api
# via code072-net ontdekt kunnen worden door Traefik/elkaar op de VPS.
#
# Gebruik: images worden LOKAAL gebouwd (niet op de VPS zelf — die deelt
# resources met WWspeur's zware Puppeteer/Chromium-scans en heeft geen swap,
# een --build daar bleek de server minutenlang vast te zetten). Op je Mac:
#   export BUILD_VERSION="$(./scripts/build-version.sh)"
#   DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose -f docker-compose.yml -f docker-compose.prod.yml build api web excel-service
#   docker save doelenboom-api:latest doelenboom-web:latest doelenboom-excel-service:latest | gzip > doelenboom-images.tar.gz
#   scp doelenboom-images.tar.gz charles@185.107.90.64:~/
# Op de VPS (image al aanwezig via docker load, dus geen --build nodig):
#   docker load < ~/doelenboom-images.tar.gz
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# LET OP: de VPS draait linux/amd64, een Apple Silicon-Mac bouwt standaard
# linux/arm64 — zonder DOCKER_DEFAULT_PLATFORM=linux/amd64 hierboven starten
# api/excel-service niet (exec-format-mismatch, "Restarting" in een lus).
# Volledige toelichting: deploy/README.md.
#
# Vereist Docker Compose >= 2.24 voor de !override-tag (idem WWspeur).
services:
  db:
    ports: !override
      - "127.0.0.1:5432:5432"   # alleen via een SSH-tunnel, niet vanaf internet
    networks:
      - default

  excel-service:
    networks:
      - default

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
      # Compose merget de 'args'-map uit docker-compose.yml normaliter al door
      # naar hier (alleen 'dockerfile' wordt overridden), maar expliciet
      # herhalen voorkomt verrassingen als dat basisbestand ooit verandert.
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    # CORS-allowlist (zie ALLOWED_ORIGINS in api/src/app.ts) — het echte
    # productiedomein. Compose merget deze map additief met de environment-
    # map uit docker-compose.yml (DATABASE_URL/PORT/JWT_SECRET/
    # EXCEL_SERVICE_URL blijven gewoon staan), net als bij de bestaande
    # selectieve overrides in dit bestand.
    environment:
      ALLOWED_ORIGINS: https://doelenboom.code072.nl
    ports: !override
      - "127.0.0.1:4000:4000"   # alleen via een SSH-tunnel, niet vanaf internet
    networks:
      - default
      - code072-net
    # Bind mount (relatief aan de compose-project-map, dus ~/doelenboom/backups
    # op de VPS) i.p.v. een named volume: zo staan de nachtelijke Excel-
    # backups (deploy/export-all-doelenbomen.sh, gepland via cron — zie
    # deploy/README.md) gewoon als losse .xlsx-bestanden op de VPS-schijf,
    # buiten Docker om inspecteerbaar/te kopiëren, en overleven ze een
    # `docker compose down`/image-vervanging. backups/ staat in .gitignore —
    # dit is data, geen code.
    volumes:
      - ./backups:/backups

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
    ports: !override []
    networks:
      - default
      - code072-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.doelenboom.rule=Host(`doelenboom.code072.nl`)
      - traefik.http.routers.doelenboom.entrypoints=websecure
      - traefik.http.routers.doelenboom.tls.certresolver=le
      # security-headers@file (uit code072-infra, gedeeld met WWspeur/de
      # welkompagina) zet frameDeny: true (X-Frame-Options: DENY). Doelenboom
      # laadt zijn eigen boomweergave (tree.html) in een same-origin iframe --
      # dat wordt door DENY ook geblokkeerd (DENY blokkeert ook same-origin
      # framing, anders dan SAMEORIGIN). Chainen ná security-headers@file
      # (een 2e middleware die alleen customFrameOptionsValue zet) bleek niet
      # te overschrijven -- frameDeny weegt kennelijk zwaarder, ook cross-
      # middleware. Daarom hier een volledig zelfstandige, doelenboom-eigen
      # headers-middleware (zelfde HSTS/nosniff als security-headers@file,
      # maar customFrameOptionsValue i.p.v. frameDeny) i.p.v. de gedeelde
      # middleware te gebruiken/chainen -- geen afhankelijkheid van chain-
      # volgorde, en de andere apps op de gedeelde infra blijven op DENY.
      - traefik.http.routers.doelenboom.middlewares=doelenboom-headers@docker
      - traefik.http.middlewares.doelenboom-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.doelenboom-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.doelenboom-headers.headers.customFrameOptionsValue=SAMEORIGIN
      - traefik.http.services.doelenboom.loadbalancer.server.port=80

networks:
  default: {}
  code072-net:
    external: true
