# docker-compose.kluis.yml — lokale KLUIS-omgeving (DOEL-133), rode driehoek "VAULT".
#
# Besluit Charles 02-11-2026: doelenbomen met gevoelige(re) informatie worden
# alleen lokaal op de Mac verwerkt, in een eigen omgeving naast acceptatie
# (optie B). De kluis draait ALTIJD dezelfde versie als productie:
# scripts/release.sh --deploy werkt hem na een geslaagde VPS-uitrol bij met
# precies de goedgekeurde acceptatie-images van die commit (scripts/kluis.sh
# --bijwerken). Hier wordt dus NOOIT gebouwd: geen build-secties, en
# pull_policy: never, zodat een ontbrekend image nooit van internet komt (A08).
#
# Verschillen met acceptatie:
#   - echte (gevoelige) gegevens: eigen database-volume, GEEN seed/demo-data;
#   - DOELENBOOM_OMGEVING=kluis: rode driehoek "VAULT", mails "[VAULT] …",
#     elke Excel-export krijgt het kenmerk "gevoelig" (andere omgevingen
#     weigeren zulke bestanden) en "GEVOELIG_" in de bestandsnaam;
#   - nachtelijke Excel-back-up naar ${KLUIS_BACKUP_DIR}/excel (zie
#     scripts/kluis-backup.sh, dagelijks 12:30 via launchd).
#
# Alleen bereikbaar op 127.0.0.1:8089. Geheimen en instellingen staan buiten
# git in ~/.doelenboom-kluis/kluis.env (scripts/kluis.sh --init); de versie in
# ~/.doelenboom-kluis/versie.env (scripts/kluis.sh --bijwerken).
# Gebruik altijd scripts/kluis.sh (of: doelenboom -local -kluis ...).
name: doelenboom-kluis

services:
  db:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: doelenboom
      POSTGRES_PASSWORD: ${KLUIS_POSTGRES_PASSWORD:?zet KLUIS_POSTGRES_PASSWORD via scripts/kluis.sh --init}
      POSTGRES_DB: doelenboom
    volumes:
      - kluis_db_data:/var/lib/postgresql
      # Alleen het schema; bewust geen db/seed.sql (demo-tenant) in de kluis.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doelenboom"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1.0

  excel-service:
    image: doelenboom-kluis-excel-service:${KLUIS_VERSIE:-nog-niet-bijgewerkt}
    pull_policy: never
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: doelenboom-kluis-api:${KLUIS_VERSIE:-nog-niet-bijgewerkt}
    pull_policy: never
    restart: "no"
    environment:
      DATABASE_URL: postgres://doelenboom:${KLUIS_POSTGRES_PASSWORD}@db:5432/doelenboom
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${KLUIS_JWT_SECRET:?zet KLUIS_JWT_SECRET via scripts/kluis.sh --init}
      EXCEL_SERVICE_URL: http://excel-service:8000
      ALLOWED_ORIGINS: http://localhost:8089,http://127.0.0.1:8089
      TRUST_PROXY_HOPS: "1"
      APP_BASE_URL: http://localhost:8089
      DOELENBOOM_OMGEVING: kluis
      # De images komen uit acceptatie (daar gebouwd vóór het taggen); de
      # versie van de release zelf (zoals productie die toont) wordt hier bij
      # het draaien gezet, zodat de voettekst gelijk is aan productie.
      BUILD_VERSION: ${KLUIS_BUILD_VERSION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply.doelenboom@code072.nl}
      SUBSCRIPTION_REQUEST_NOTIFY_EMAIL: ${SUBSCRIPTION_REQUEST_NOTIFY_EMAIL:-info.doelenboom@code072.nl}
    volumes:
      # Nachtelijke Excel-back-up (exportAllDoelenbomen) — zelfde mechanisme
      # als productie (docker-compose.prod.yml), maar buiten de repo.
      - ${KLUIS_BACKUP_DIR:?zet KLUIS_BACKUP_DIR via scripts/kluis.sh --init}/excel:/backups
    depends_on:
      db:
        condition: service_healthy
      excel-service:
        condition: service_started
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: doelenboom-kluis-web:${KLUIS_VERSIE:-nog-niet-bijgewerkt}
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kluis_db_data:
