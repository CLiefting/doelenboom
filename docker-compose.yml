services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doelenboom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doelenboom}
      POSTGRES_DB: ${POSTGRES_DB:-doelenboom}
    volumes:
      # Vanaf de postgres-images v18 wordt één mount op /var/lib/postgresql
      # verwacht (in plaats van direct op .../data erin): de image zet data dan
      # zelf in een major-versie-specifieke submap (pg_ctlcluster-achtige opzet,
      # met het oog op toekomstige pg_upgrade --link). Mounten op .../data zelf
      # laat de v18-image weigeren te starten met een expliciete foutmelding.
      - db_data:/var/lib/postgresql
      # Alle *.sql in ./db draaien alfabetisch bij de allereerste containerstart
      # (Postgres docker-entrypoint-initdb.d-conventie): init.sql (schema) vóór
      # seed.sql (databestand), dankzij de bestandsnaam-sortering.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doelenboom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  excel-service:
    build: ./excel-service
    # Vaste tag (i.p.v. de door compose afgeleide project-naam-tag) zodat een
    # lokaal gebouwde image via `docker save`/`docker load` 1-op-1 op de VPS
    # herbruikt kan worden — zie deploy/README.md ("Lokaal bouwen, VPS laadt
    # alleen"). Dit voorkomt dat de VPS zelf npm/pip-builds moet draaien,
    # wat op de gedeelde, resource-krappe server tot ernstige contentie leidde.
    image: doelenboom-excel-service:latest
    restart: unless-stopped
    # Geen host-poort-mapping: alleen de api-container praat hiermee, via het
    # interne Docker-netwerk (http://excel-service:8000). Zo voorkomen we
    # conflicten met poort 8000 op de host (bv. AirPlay Receiver op macOS).

  api:
    build:
      context: ./api
      # BUILD_VERSION exporteren vóór `docker compose build`/`up --build` om 'm
      # mee te geven, bv.: export BUILD_VERSION="$(./scripts/build-version.sh)"
      # (zie dat script) — zonder die env var valt dit terug op "dev" (zie
      # api/Dockerfile ARG-default), dus een lokale `docker compose up --build`
      # blijft ook zonder die stap gewoon werken, alleen toont de footer dan
      # geen onderscheidende versie.
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: doelenboom-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-doelenboom}:${POSTGRES_PASSWORD:-doelenboom}@db:5432/${POSTGRES_DB:-doelenboom}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-verander-mij}
      EXCEL_SERVICE_URL: http://excel-service:8000
      # MFA-e-mail (zie doelenboom_mfa_ontwerp.md in het project en
      # api/src/email.ts) — SMTP_HOST leeg/ontbrekend (de standaard hier) laat
      # email.ts terugvallen op de console-log-fallback i.p.v. echt mailen,
      # dus dit is ook zonder ingevulde .env veilig leeg te laten.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply.doelenboom@code072.nl}
      # Expliciet i.p.v. te vertrouwen op dependencyHealth.ts's eigen
      # cwd-gebaseerde fallback (`path.resolve(process.cwd(), '..', 'sbom')`,
      # bedoeld voor lokaal `npm run dev` zonder Docker vanuit api/): met
      # WORKDIR /app (zie api/Dockerfile) en `npm run dev` z'n cwd ook op
      # /app, zou die fallback hier op "/sbom" uitkomen — één map te hoog,
      # niet waar het volume hieronder daadwerkelijk gemount is.
      SBOM_DIR: /app/sbom
    ports:
      - "4000:4000"
    volumes:
      # Door scripts/generate-sbom.sh op de host gegenereerde CycloneDX-SBOM's
      # (zie .gitignore/doelenboom_sbom_ontwerp.md) — read-only, want de api
      # leest dit alleen (api/src/dependencyHealth.ts, SBOM_DIR hierboven).
      # Ontbreekt de map/staat hij leeg (nog niet gegenereerd), dan valt de
      # Softwarecomponenten-pagina terug op "geen SBOM beschikbaar" i.p.v. te
      # crashen. docker-compose.prod.yml merget dit additief mee, geen aparte
      # override nodig.
      - ./sbom:/app/sbom:ro
    depends_on:
      db:
        condition: service_healthy
      excel-service:
        condition: service_started

  web:
    build: ./web
    image: doelenboom-web:latest
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
