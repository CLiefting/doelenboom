# Beveiligingsheaders voor de statische frontend (DOEL-30, analyse M-niveau).
# Wordt met "include" opgenomen in de locations van nginx.conf die statische
# bestanden serveren. Dat moet per location: nginx erft add_header NIET van het
# server-niveau zodra een location er zelf een heeft (bv. Cache-Control bij
# /tree.html). /api/ krijgt deze headers bewust niet — daar zet de API zelf
# (helmet) de headers.
#
# HSTS, nosniff en X-Frame-Options worden door Traefik gezet (zie
# docker-compose.prod.yml); Referrer-Policy en Permissions-Policy staan daar
# óók (dezelfde waarde), zodat ze ook gelden als deze nginx ooit zonder die
# Traefik-middleware draait.
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Content-Security-Policy. Let op: script-src en style-src hebben 'unsafe-inline'
# nodig omdat web/public/tree.html één groot inline <script> en inline
# style-attributen gebruikt (en de "statische boom"-export dat inline script
# kopieert). Deze CSP houdt daarom nog GEEN geïnjecteerd inline script tegen; ze
# beperkt wel wat een geslaagde XSS kan doen: geen verbindingen naar andere
# origins (connect-src, dus geen exfiltratie van het token), geen plugins
# (object-src), geen <base>-truc (base-uri), geen formulieren naar buiten
# (form-action) en alleen same-origin framing (frame-ancestors/frame-src).
# Vervolgstap voor een strenge CSP: het script uit tree.html naar een eigen
# bestand verplaatsen en dan 'unsafe-inline' bij script-src schrappen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
