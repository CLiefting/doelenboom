server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Alles onder /api/ gaat naar de api-container. Bewust dezelfde origin als
    # de frontend (net als bij WWspeur) — geen CORS-gedoe, en tree.html/App.tsx
    # kunnen gewoon relatieve /api/-paden gebruiken (zie VITE_API_URL='' in
    # docker-compose.prod.yml).
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel-import is server-side begrensd op 25 MB (multer, zie
        # api/src/routes/imports.ts); 30m geeft ruimte voor multipart-overhead.
        client_max_body_size 30m;

        # Excel-export/import kan even duren (parsen/genereren via de
        # excel-service); ruime marge, geen harde noodzaak maar geen kwaad.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # tree.html draait in een iframe (zie web/src/pages/TreePage.tsx) en heeft,
    # anders dan de door Vite gehashte JS/CSS-bundels, geen cache-bustende
    # bestandsnaam — zonder expliciete Cache-Control bleven browsers 'm na een
    # nieuwe deploy soms gewoon uit cache serveren (vooral binnen de iframe,
    # waar een hard refresh van de hoofdpagina niet altijd doorwerkt). no-cache
    # dwingt een revalidatie (If-Modified-Since/ETag) bij elke load — nog steeds
    # snel als er niets gewijzigd is, maar nooit meer stilzwijgend verouderd.
    location = /tree.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # /tree.html (hierboven), geëxporteerde assets, etc. staan als losse
    # bestanden in de build-output (web/public/*) en worden hier gewoon direct
    # gevonden. Onbekende paden (incl. /dbstat, /sessions — client-side
    # pathname-routing in main.tsx, geen routerbibliotheek) vallen terug op
    # index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
