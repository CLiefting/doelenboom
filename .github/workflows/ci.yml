name: CI

# Structurele borging van Charles' vaste eis bij securitywerk ("altijd
# OWASP-testen laten uitvoeren, in ieder geval de OWASP Top 10", zie
# doelenboom_security_review_voortgang.md in de projectkennis) -- tot nu toe
# was dat een handmatige stap per code-review-punt; deze pipeline laat het
# voortaan automatisch bij elke push/PR gebeuren, zonder dat iemand eraan
# hoeft te denken.
#
# Vijf losse jobs, allemaal parallel:
#   - api/web/excel-service: de bestaande testsuites (incl. de eerder
#     toegevoegde OWASP-regressietests: SEC-001 stored-XSS, SEC-003 live-
#     sysadmin-recht, SEC-004 MFA-race) -- BLOKKEREND, zoals een testsuite
#     hoort te zijn.
#   - owasp-semgrep/secret-scan/dependency-audit: nieuwe, bredere scans over
#     de hele repo. Bewust NIET blokkerend bij de eerste uitrol (er is nog
#     geen baseline, dus een eerste run kan bestaande/onschadelijke
#     bevindingen laten zien) -- zie de toelichting bij elke job. Charles kan
#     dit per job op blokkerend zetten (continue-on-error weghalen) zodra
#     de eerste bevindingen zijn getrieerd.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: api — tests (tsc + node:test)
    runs-on: ubuntu-latest
    services:
      # Zelfde image/versie als docker-compose.yml. api/scripts/reset-test-db.ts
      # verwacht dat de "doelenboom"-database (POSTGRES_DB hieronder) al
      # bestaat -- die gebruikt het als onderhoudsverbinding om de losse
      # "doelenboom_test"-database bij elke testrun te droppen/opnieuw aan te
      # maken vanuit db/init.sql (één bron van waarheid, geen los CI-schema).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: doelenboom
          POSTGRES_PASSWORD: doelenboom
          POSTGRES_DB: doelenboom
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - working-directory: api
        run: npm ci
      - working-directory: api
        run: npm run build
      - working-directory: api
        # EXCEL_SERVICE_URL wijst hier bewust naar niets -- de handvol tests
        # die een bereikbare excel-service nodig hebben (project-export/
        # project-pptx) slaan zichzelf dan netjes over (t.skip), zie
        # projectExcel.test.ts. Geen aparte Python-service opzetten voor deze
        # job; excel-service heeft zijn eigen testjob hieronder.
        run: npm test
        env:
          POSTGRES_ADMIN_URL: postgres://doelenboom:doelenboom@localhost:5432/doelenboom
          TEST_DATABASE_URL: postgres://doelenboom:doelenboom@localhost:5432/doelenboom_test
          JWT_SECRET: ci-test-secret
          EXCEL_SERVICE_URL: http://localhost:8000
          SBOM_DIR: /tmp/doelenboom-ci-sbom-does-not-exist

  web:
    name: web — typecheck + build + XSS-regressietest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - name: SEC-001 regressietest (stored XSS in tree.html)
        # web/ heeft geen frontend-testframework (bewuste keuze, zie
        # doelenboom_sbom_ontwerp.md §10) -- deze test gebruikt puur Node's
        # ingebouwde test runner, geen extra dependency nodig.
        run: node --test web/test/*.test.mjs

  excel-service:
    name: excel-service — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            excel-service/requirements.txt
            excel-service/requirements-dev.txt
      - working-directory: excel-service
        run: pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: excel-service
        run: python -m pytest -q

  owasp-semgrep:
    name: OWASP Top 10 — Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (p/owasp-top-ten)
        # Niet-blokkerend bij de eerste uitrol -- geen bestaande baseline om
        # tegenaf te zetten, dus een eerste run kan ruis bevatten. Bekijk de
        # jobsamenvatting/annotaties en zet continue-on-error hieronder uit
        # zodra de bevindingen zijn getrieerd (of triage ze weg met
        # `// nosemgrep` op de betreffende regel, zie Semgrep-documentatie).
        run: semgrep scan --config p/owasp-top-ten --error
        continue-on-error: true

  secret-scan:
    name: Secret-scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        # Rechtstreeks de open-source gitleaks-CLI via Docker i.p.v. de
        # gitleaks/gitleaks-action -- die vereist inmiddels een (betaalde)
        # licentie voor private repositories.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact -v
        continue-on-error: true

  dependency-audit:
    name: Kwetsbare/verouderde dependencies (npm audit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Niet-blokkerend: dit is een signaal, geen harde eis -- de
      # Softwarecomponenten-pagina in de app zelf (zie
      # doelenboom_sbom_ontwerp.md) doet al doorlopende, diepere
      # kwetsbaarhedenmonitoring (incl. OSV.dev) met een eigen review-flow;
      # dit is puur een extra, snelle CI-vangnet bij elke push/PR.
      - name: npm audit — api
        working-directory: api
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: npm audit — web
        working-directory: web
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: pip-audit — excel-service
        working-directory: excel-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
